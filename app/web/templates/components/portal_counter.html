<section
    class="portal-counter-block"
    data-portal-counter
    hidden
    aria-live="polite"
>
    <p
        class="portal-counter__title"
        data-i18n="counterHeading"
    >
        Wi-Fi qoşulmaları
    </p>

    <div class="portal-counter">
        <div class="portal-counter__item">
            <span
                class="portal-counter__label"
                data-i18n="counterToday"
            >Bu gün</span>
            <strong
                class="portal-counter__value"
                data-portal-counter-today
            >—</strong>
        </div>
        <div class="portal-counter__item">
            <span
                class="portal-counter__label"
                data-i18n="counterTotal"
            >Ümumi</span>
            <strong
                class="portal-counter__value"
                data-portal-counter-total
            >—</strong>
        </div>
    </div>
</section>
