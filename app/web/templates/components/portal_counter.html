<section
    class="portal-counter"
    data-portal-counter
    hidden
    aria-live="polite"
>
    <div class="portal-counter__item">
        <span class="portal-counter__label">
            Bu gün portal açılışları
        </span>
        <strong
            class="portal-counter__value"
            data-portal-counter-today
        >—</strong>
    </div>
    <div class="portal-counter__item">
        <span class="portal-counter__label">
            Ümumi portal açılışları
        </span>
        <strong
            class="portal-counter__value"
            data-portal-counter-total
        >—</strong>
    </div>
</section>
