<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaptivPortal Admin Login</title>
  <link rel="stylesheet" href="{{ url_for('admin_web_v1.static', filename='admin.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand login-brand"><span class="brand-mark" aria-hidden="true">CP</span><span>CaptivPortal</span></div>
    <h1>Admin sign in</h1>
    {% if error_message %}<p role="alert">{{ error_message }}</p>{% endif %}
    <form class="login-form" method="post" action="{{ form_action }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
