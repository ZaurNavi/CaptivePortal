{% extends "admin/base.html" %}
{% block subtitle %}<p>Site membership from authorized snapshots and visits.</p>{% endblock %}
{% block controls %}
<form id="device-search-form" class="filter-bar" novalidate>
  <label for="device-mac">Exact MAC address</label>
  <input id="device-mac" name="mac" inputmode="text" autocomplete="off" placeholder="AA:BB:CC:DD:EE:FF" maxlength="17">
  <button class="button button-secondary" type="submit">Search</button>
  <button id="clear-device-search" class="button button-quiet" type="button">Clear</button>
</form>
<section id="device-inventory-summary" class="card device-inventory" aria-labelledby="device-inventory-title" aria-live="polite">
  <h2 id="device-inventory-title">Device Inventory</h2>
  <div class="device-inventory-metrics">
    <div><span class="device-row-label">Total Devices</span><strong id="device-inventory-total" class="metric">—</strong></div>
    <div><span class="device-row-label">New Today</span><strong id="device-inventory-today" class="metric">—</strong></div>
  </div>
  <p id="device-inventory-state" class="live-detail"></p>
</section>
{% endblock %}
